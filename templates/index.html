<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Title</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
<div class="container">
    <div class="flashed">
        {% for flash in get_flashed_messages() %}
            <div class="alert">{{flash}}</div>
        {% endfor %}
    </div>

<form method="GET" class="first form">
    <label>Select Author:</label>
    <select name="author" id="authors" onchange="this.form.submit()">
        <option value="">Choose an author</option>
        {% for author in authors %}
        <option value="{{author}}" {% if author == selected %}selected{% endif %}> {{author}}</option>
        {% endfor %}
    </select>
</form>
    {% if results %}
    <h3>{{results.author}}</h3>
    <ul>
        {% for book in results.books %}
        <li>
            {{book.title}}
            {{book.year}}
        </li>
        {%endfor%}
    </ul>

{% else %}
<p>No books found</p>
{% endif %}
<br>
<br>
<h3>Add a new author:</h3>
<form method="POST" action="/add" class="second form">
    <label>Author Full Name:</label>
    <input type="text" name="name" placeholder="Ex. Agatha Christie"><br>
    <br><input type="submit" value="Submit">

</form>
</div>
</body>
</html>

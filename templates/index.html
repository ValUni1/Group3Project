<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Title</title>
</head>
<body>
{%for result in results%}
{{result.author}}
    {% if result.books%}
    <ul>
        {% for book in result.books %}
        <li>
            {{book.title}}
            {{book.year}}
        </li>
        {%endfor%}
    </ul>

{% else %}
<p>No books found</p>
{% endif %}
{%endfor%}
</body>
</html>
